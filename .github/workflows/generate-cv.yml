name: Generate CV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node index.js

      - name: Upload CV
        uses: actions/upload-artifact@v4
        with:
          name: Grace-CV
          path: Grace_Ndungu_Denri_Sales_CV.docx
